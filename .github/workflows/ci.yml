name: CI

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Architecture boundary check
        run: python3 scripts/check_architecture_boundaries.py
      - name: Docs source-of-truth check
        run: python3 scripts/check_docs_source_of_truth.py
      - name: Examples catalog check
        run: python3 scripts/check_examples_catalog.py
      - name: Benchmark budget check
        run: python3 scripts/check_benchmark_budgets.py
      - name: Performance benchmark smoke
        run: |
          for size in small medium; do
            cargo run -q -p sg-cli -- perf fixture generate --size "$size" --output "/tmp/sg-perf-$size"
            cargo run -q -p sg-cli -- --format json perf run --fixture "/tmp/sg-perf-$size" --check --budget tests/performance/budget-placeholders.json > "/tmp/sg-perf-$size-report.json"
            python3 - "$size" <<'PY'
          import json, sys
          size = sys.argv[1]
          report = json.load(open(f"/tmp/sg-perf-{size}-report.json"))
          assert report["schemaVersion"] == "specgraph.cli/v1"
          assert report["status"] == "passed"
          data = report["data"]
          assert data["schemaVersion"] == "specgraph.performance-results/v1"
          assert data["fixtureId"] == f"perf-fixture-{size}"
          assert len(data["results"]) >= 8
          PY
          done
      - name: Phase 7 asset check
        run: python3 scripts/check_phase7_assets.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: CLI JSON contract smoke
        run: |
          cargo run -q -p sg-cli -- --format json adapter audit --check > /tmp/sg-adapter-audit.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/sg-adapter-audit.json"))
          assert report["schemaVersion"] == "specgraph.cli/v1"
          assert report["status"] == "passed"
          assert report["data"]["adapterCount"] >= 1
          PY
      - name: Proof scenario
        run: cargo run -p sg-cli -- proof run
      - name: SpecGraph CI validation
        run: |
          if [ -d .specgraph ]; then
            cargo run -p sg-cli -- ci validate --report-file .specgraph/validation/ci-report.json
          else
            echo "SpecGraph store not initialized in this checkout; skipping sg ci validate"
          fi
      - name: CLI smoke test
        run: cargo run -p sg-cli -- --version
