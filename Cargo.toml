[workspace]
members = [
    "crates/sg-core",
    "crates/sg-cli",
    "crates/sg-action",
    "crates/sg-adapter-api",
    "crates/sg-adapter-ci",
    "crates/sg-adapter-code",
    "crates/sg-adapter-git",
    "crates/sg-adapter-hosting",
    "crates/sg-adapter-llm",
    "crates/sg-adapter-test",
    "crates/sg-adoption",
    "crates/sg-architecture",
    "crates/sg-canonical",
    "crates/sg-codegraph",
    "crates/sg-data",
    "crates/sg-gitgraph",
    "crates/sg-impact",
    "crates/sg-issue",
    "crates/sg-merge",
    "crates/sg-model",
    "crates/sg-module-graph",
    "crates/sg-ontology",
    "crates/sg-operation",
    "crates/sg-policy",
    "crates/sg-project",
    "crates/sg-proposal",
    "crates/sg-query",
    "crates/sg-sdk",
    "crates/sg-server",
    "crates/sg-spec",
    "crates/sg-store",
    "crates/sg-testgraph",
    "crates/sg-validation",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Onurakdeniz/SpecGraph"
version = "0.1.0"

[workspace.dependencies]
sg-adapter-api = { path = "crates/sg-adapter-api" }
sg-impact = { path = "crates/sg-impact" }
sg-issue = { path = "crates/sg-issue" }
sg-merge = { path = "crates/sg-merge" }
sg-policy = { path = "crates/sg-policy" }
sg-project = { path = "crates/sg-project" }
sg-proposal = { path = "crates/sg-proposal" }
sg-spec = { path = "crates/sg-spec" }
sg-validation = { path = "crates/sg-validation" }
sg-canonical = { path = "crates/sg-canonical" }
sg-model = { path = "crates/sg-model" }
sg-operation = { path = "crates/sg-operation" }
sg-query = { path = "crates/sg-query" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
